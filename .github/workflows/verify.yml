name: Verify application
on:
  push:
    branches: [main, phase-7-shortlist]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PORT: 5176
      CLIENT_URL: http://localhost:5176
      FRONTEND_URL: http://localhost:5176
      MONGO_URI: mongodb://127.0.0.1:27017/sarkari_saathi_ci
      JWT_EXPIRES_IN: 1h
      MAIL_MODE: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate ephemeral CI secret
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + require('crypto').randomBytes(48).toString('base64url') + '\n')"
      - name: API, rule, environment and lifecycle tests
        run: npm test
      - name: Build same-origin frontend
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Seed reviewed catalog
        run: npm run seed:schemes
      - name: Start production server and check database readiness
        run: |
          mkdir -p reports
          npm start > reports/production-server.log 2>&1 &
          npm run check:health
      - name: Production browser to API to database flow
        run: npm run test:production-browser
      - name: Additional feature browser flows
        run: npm run test:additions-browser
      - name: Stop test server
        if: always()
        run: fuser -k 5176/tcp || true
